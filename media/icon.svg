<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: brand indigo, top-left bright → bottom-right deep -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Top-left glow for depth / glass feel -->
    <radialGradient id="glow" cx="28%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle noise mask for texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Rounded-square background (iOS-style 22% radius) -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Depth glow -->
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- ─── Loom "L" mark ───────────────────────────────────────────
       Stroke width: 84 px — consistent on both arms.
       Vertical arm: x=136–220, y=108–404   (height 296)
       Horizontal arm: x=136–380, y=320–404  (width 244)
       Arms share the bottom-left corner — inner "L" junction is
       naturally formed by the overlapping white rectangles.
  ─────────────────────────────────────────────────────────────── -->

  <!-- Vertical arm -->
  <rect x="136" y="108" width="84" height="296" rx="28" fill="white"/>

  <!-- Horizontal arm (overlaps bottom of vertical arm → clean corner) -->
  <rect x="136" y="320" width="244" height="84" rx="28" fill="white"/>
</svg>
